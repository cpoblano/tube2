<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Browser</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="browser-container">
        <!-- Address Bar -->
        <div class="address-bar">
            <input 
                type="text" 
                id="addressInput" 
                placeholder="Enter URL or search..." 
                class="address-input"
            >
            <button id="goBtn" class="go-btn">Go</button>
        </div>

        <!-- Navigation Buttons -->
        <div class="nav-buttons">
            <button id="backBtn" class="nav-btn" title="Back">←</button>
            <button id="forwardBtn" class="nav-btn" title="Forward">→</button>
            <button id="refreshBtn" class="nav-btn" title="Refresh">⟳</button>
            <button id="homeBtn" class="nav-btn" title="Home">⌂</button>
        </div>

        <!-- Browser View Container -->
        <div class="browser-content">
            <div id="homepage" class="homepage active">
                <div class="search-container">
                    <h1>Simple Browser</h1>
                    <div class="search-box">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Search the web..."
                            class="search-input"
                        >
                        <button id="searchBtn" class="search-btn">Search</button>
                    </div>
                </div>
            </div>

            <iframe id="contentFrame" class="content-frame"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
